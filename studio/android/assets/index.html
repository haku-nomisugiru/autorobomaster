<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'"><title>RoboMaster 控制台</title><link rel="stylesheet" href="console.css"></head>
<body><header><span class="brand">◈ &nbsp; ROBOMASTER</span><button id="device" aria-label="设备设置">设备</button></header>
<section id="pair"><div class="cover"><div class="ring">◈</div><h1>连接工作台</h1><p>打开电脑 Studio 的「设置 → 手机控制台」，扫描配对二维码。</p></div><button class="primary" id="scan">扫描配对码</button><button id="album">从相册识别</button><button id="back" hidden>返回项目</button><button id="forget" hidden>解除本机配对</button></section>
<main id="work" hidden><div id="status" role="status">正在连接</div><h1 id="project"></h1><nav id="nav" aria-label="工作阶段"></nav><section id="page"><h2 id="stage"></h2><div id="decision"></div><div id="history"></div><details id="info"><summary>项目规格与迭代记录</summary><div id="spec"></div></details></section><footer><textarea id="input" rows="2" placeholder="给当前阶段发消息"></textarea><div class="actions"><button id="stop" hidden>请求停止</button><button id="send" class="primary">发送</button></div></footer></main><div id="toast" role="status"></div><script src="console.js"></script></body></html>
